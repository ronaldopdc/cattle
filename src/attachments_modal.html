<!-- Attachments Modal -->
<div id="attachmentsModal"
    style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7);">
    <div
        style="position: relative; margin: 5% auto; padding: 2rem; width: 600px; max-width: 90%; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);">
        <span onclick="closeAttachmentsModal()"
            style="position: absolute; right: 1.5rem; top: 1.5rem; font-size: 2rem; font-weight: bold; cursor: pointer; color: #94a3b8; transition: color 0.3s;">&times;</span>

        <h2 style="margin-top: 0; color: #a78bfa; font-weight: 600;">Anexos da Parceria #<span
                id="modal-partnership-id"></span></h2>

        <!-- Upload Form (hidden for read-only users: they can only download) -->
        <div style="background: rgba(255, 255, 255, 0.03); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;<?= is_confinement_only_user() ? ' display: none;' : '' ?>">
            <h3 style="margin-top: 0; color: #e2e8f0; font-size: 1.1rem;">Enviar Novo Anexo</h3>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label style="color: #cbd5e1;">Arquivo(s)</label>
                    <input type="file" id="attachment-file" required multiple
                        accept=".pdf,.jpg,.jpeg,.png,.gif,.docx,.xlsx,.zip"
                        style="width: 100%; padding: 0.75rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #e2e8f0;">
                    <small style="color: #94a3b8; display: block; margin-top: 0.5rem;">Formatos permitidos: PDF, JPG,
                        PNG, GIF, DOCX, XLSX, ZIP (máx 10MB).<br>
                        Ao selecionar <strong>vários arquivos</strong>, o sistema identifica automaticamente
                        NF, GTA e Relatório de Pesagem, valida contra a parceria e preenche a descrição.</small>
                </div>
                <div class="form-group" id="single-description-group">
                    <label style="color: #cbd5e1;">Descrição (opcional)</label>
                    <textarea id="attachment-description" rows="2"
                        style="width: 100%; padding: 0.75rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #e2e8f0; resize: vertical;"
                        placeholder="Descrição do anexo..."></textarea>
                </div>
                <button type="submit" id="attachment-submit-btn" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-upload"></i> Enviar Anexo
                </button>
            </form>

            <!-- Resultado da análise/validação (upload múltiplo) -->
            <div id="analysis-result" style="display: none; margin-top: 1rem;"></div>
        </div>

        <!-- Attachments List -->
        <div>
            <h3 style="color: #e2e8f0; font-size: 1.1rem;">Anexos Existentes</h3>
            <div id="attachments-list" style="max-height: 300px; overflow-y: auto;">
                <!-- Attachments will be loaded here -->
            </div>
        </div>
    </div>
</div>

<script>
    // Confinamento-only users get read-only attachments: download only, no
    // upload and no delete.
    const ATTACHMENTS_READ_ONLY = <?= is_confinement_only_user() ? 'true' : 'false' ?>;

    let currentPartnershipIdForModal = null;

    function openAttachmentsModal(partnershipId) {
        currentPartnershipIdForModal = partnershipId;
        document.getElementById('modal-partnership-id').innerText = partnershipId;
        document.getElementById('attachmentsModal').style.display = 'block';
        loadAttachments(partnershipId);
    }

    function closeAttachmentsModal() {
        document.getElementById('attachmentsModal').style.display = 'none';
        document.getElementById('uploadForm').reset();
        resetAnalysisUI();
    }

    function resetAnalysisUI() {
        const box = document.getElementById('analysis-result');
        box.style.display = 'none';
        box.innerHTML = '';
    }

    // Alterna a UI conforme a quantidade de arquivos selecionados
    document.getElementById('attachment-file').addEventListener('change', function () {
        const multiple = this.files.length > 1;
        const descGroup = document.getElementById('single-description-group');
        const btn = document.getElementById('attachment-submit-btn');
        descGroup.style.display = multiple ? 'none' : '';
        if (multiple) {
            btn.innerHTML = '<i class="fas fa-magnifying-glass-chart"></i> Analisar e Enviar ' + this.files.length + ' Anexos';
        } else {
            btn.innerHTML = '<i class="fas fa-upload"></i> Enviar Anexo';
        }
        resetAnalysisUI();
    });

    const TIPO_LABELS = {
        nota_fiscal: 'Nota Fiscal',
        gta: 'GTA',
        pesagem: 'Relatório de Pesagem',
        desconhecido: 'Tipo desconhecido'
    };

    // Renderiza o resultado da análise (documentos detectados + erros de validação)
    function renderAnalysis(docs, errors, ignored) {
        const box = document.getElementById('analysis-result');
        let html = '';

        const reconhecidos = Array.isArray(docs) ? docs.filter(d => d.tipo !== 'desconhecido' && d.readable) : [];
        if (reconhecidos.length) {
            html += '<div style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 6px; margin-bottom: 0.75rem;">';
            html += '<div style="color:#e2e8f0; font-weight:600; margin-bottom:0.5rem;">Documentos identificados</div>';
            reconhecidos.forEach(d => {
                const label = TIPO_LABELS[d.tipo] || d.tipo;
                html += `<div style="display:flex; justify-content:space-between; gap:0.5rem; padding:0.35rem 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                    <span style="color:#cbd5e1; font-size:0.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${d.filename}</span>
                    <span style="color:#22c55e; font-size:0.85rem; font-weight:500; white-space:nowrap;">${d.descricao || label}</span>
                </div>`;
            });
            html += '</div>';
        }

        if (Array.isArray(ignored) && ignored.length) {
            html += '<div style="background: rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.25); padding:0.75rem 1rem; border-radius:6px; margin-bottom:0.75rem;">';
            html += '<div style="color:#f59e0b; font-size:0.85rem;"><i class="fas fa-circle-info"></i> Ignorado(s) (não é NF/GTA/pesagem): '
                + ignored.map(f => `<span style="color:#fcd34d;">${f}</span>`).join(', ') + '</div>';
            html += '</div>';
        }

        if (Array.isArray(errors) && errors.length) {
            html += '<div style="background: rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); padding:1rem; border-radius:6px;">';
            html += '<div style="color:#ef4444; font-weight:600; margin-bottom:0.5rem;"><i class="fas fa-triangle-exclamation"></i> Upload bloqueado — corrija as inconsistências:</div>';
            html += '<ul style="margin:0; padding-left:1.25rem; color:#fecaca; font-size:0.85rem;">';
            errors.forEach(e => { html += `<li style="margin-bottom:0.25rem;">${e}</li>`; });
            html += '</ul></div>';
        }

        box.innerHTML = html;
        box.style.display = html ? 'block' : 'none';
    }

    // Close modal when clicking outside
    window.onclick = function (event) {
        const modal = document.getElementById('attachmentsModal');
        if (event.target == modal) {
            closeAttachmentsModal();
        }
    }

    async function loadAttachments(partnershipId) {
        try {
            const response = await fetch(`partnerships.php?action=get_attachments&partnership_id=${partnershipId}`);
            const attachments = await response.json();

            const listDiv = document.getElementById('attachments-list');

            if (attachments.length === 0) {
                listDiv.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 2rem;">Nenhum anexo encontrado</p>';
                return;
            }

            let html = '';
            attachments.forEach(att => {
                const fileSize = (att.file_size / 1024).toFixed(1) + ' KB';
                const uploadDate = new Date(att.uploaded_at).toLocaleDateString('pt-BR');
                const fileIcon = getFileIcon(att.file_type);

                html += `
                <div style="background: rgba(255, 255, 255, 0.03); padding: 1rem; border-radius: 6px; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center;">
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <i class="${fileIcon}" style="font-size: 1.5rem; color: #a78bfa;"></i>
                            <div>
                                <div style="color: #e2e8f0; font-weight: 500;">${att.filename}</div>
                                <div style="color: #94a3b8; font-size: 0.875rem;">${fileSize} • ${uploadDate}</div>
                                ${att.description ? `<div style="color: #cbd5e1; font-size: 0.875rem; margin-top: 0.25rem;">${att.description}</div>` : ''}
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button onclick="downloadAttachment(${att.id}, '${att.filename}')" class="btn btn-icon" title="Baixar" style="background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.2); color: #22c55e;">
                            <i class="fas fa-download"></i>
                        </button>
                        ${ATTACHMENTS_READ_ONLY ? '' : `
                        <button onclick="deleteAttachment(${att.id})" class="btn btn-icon" title="Excluir" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #ef4444;">
                            <i class="fas fa-trash"></i>
                        </button>`}
                    </div>
                </div>
            `;
            });

            listDiv.innerHTML = html;
        } catch (error) {
            console.error('Error loading attachments:', error);
            document.getElementById('attachments-list').innerHTML = '<p style="color: #ef4444;">Erro ao carregar anexos</p>';
        }
    }

    function getFileIcon(fileType) {
        if (fileType.includes('pdf')) return 'fas fa-file-pdf';
        if (fileType.includes('image')) return 'fas fa-file-image';
        if (fileType.includes('word') || fileType.includes('document')) return 'fas fa-file-word';
        if (fileType.includes('excel') || fileType.includes('spreadsheet')) return 'fas fa-file-excel';
        if (fileType.includes('zip')) return 'fas fa-file-archive';
        return 'fas fa-file';
    }

    function downloadAttachment(attachmentId, filename) {
        window.location.href = `partnerships.php?action=download_attachment&id=${attachmentId}`;
    }

    async function deleteAttachment(attachmentId) {
        if (!confirm('Tem certeza que deseja excluir este anexo?')) {
            return;
        }

        try {
            const response = await fetch(`partnerships.php?action=delete_attachment&id=${attachmentId}`);
            const result = await response.json();

            if (result.success) {
                loadAttachments(currentPartnershipIdForModal);
            } else {
                alert('Erro ao excluir anexo: ' + result.message);
            }
        } catch (error) {
            console.error('Error deleting attachment:', error);
            alert('Erro ao excluir anexo');
        }
    }

    // Handle upload form submission
    document.getElementById('uploadForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const fileInput = document.getElementById('attachment-file');
        if (!fileInput.files.length) {
            alert('Por favor, selecione um arquivo');
            return;
        }

        resetAnalysisUI();

        if (fileInput.files.length > 1) {
            await uploadMultipleFiles(fileInput.files);
        } else {
            await uploadSingleFile(fileInput.files[0]);
        }
    });

    async function uploadSingleFile(file) {
        const description = document.getElementById('attachment-description').value;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('partnership_id', currentPartnershipIdForModal);
        formData.append('description', description);

        try {
            const response = await fetch('partnerships.php?action=upload_attachment', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();

            if (result.success) {
                document.getElementById('uploadForm').reset();
                loadAttachments(currentPartnershipIdForModal);
                alert('Arquivo enviado com sucesso!');
            } else {
                alert('Erro ao enviar arquivo: ' + result.message);
            }
        } catch (error) {
            console.error('Error uploading attachment:', error);
            alert('Erro ao enviar arquivo');
        }
    }

    async function uploadMultipleFiles(files) {
        const btn = document.getElementById('attachment-submit-btn');
        const originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analisando documentos...';

        const formData = new FormData();
        formData.append('partnership_id', currentPartnershipIdForModal);
        for (let i = 0; i < files.length; i++) {
            formData.append('files[]', files[i]);
        }

        try {
            const response = await fetch('partnerships.php?action=upload_attachments_batch', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            renderAnalysis(result.docs || [], result.errors || [], result.ignored || []);

            if (result.success) {
                document.getElementById('uploadForm').reset();
                document.getElementById('single-description-group').style.display = '';
                loadAttachments(currentPartnershipIdForModal);
                alert(result.message);
            } else if (!result.blocked) {
                // Erro que não é de validação (ex: tipo/tamanho inválido)
                alert('Erro: ' + (result.message || 'Falha ao enviar anexos'));
            }
        } catch (error) {
            console.error('Error uploading attachments:', error);
            alert('Erro ao enviar anexos');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    }
</script>
